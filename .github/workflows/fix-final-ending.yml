name: Fix final ending escapes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-final-ending:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace literal backslash-n safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          slash_n = chr(92) + 'n'
          slash_star = chr(92) + '*'
          slash_dot = chr(92) + '.'

          # The accidental final-ending paste contains real backslash+n text.
          # Convert it to actual newlines. This document has no intentional
          # backslash+n text in its HTML/CSS/final-ending JavaScript.
          s = s.replace(slash_n, '\n')

          # Remove the accidental escaped punctuation from the injected JS.
          s = s.replace(slash_star, '*').replace(slash_dot, '.')

          p.write_text(s, encoding='utf-8')
          print('Remaining literal backslash-n:', s.count(slash_n))
          PY

      - name: Verify complete inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          slash_n = chr(92) + 'n'
          slash_star = chr(92) + '*'
          slash_dot = chr(92) + '.'

          remaining = html.count(slash_n)
          if remaining:
              raise SystemExit(f'Literal backslash+n remains in index.html: {remaining}')
          if slash_star in html or slash_dot in html:
              raise SystemExit('Accidental escaped punctuation remains in index.html')

          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          print(f'Found {len(scripts)} inline script block(s); checking combined JavaScript...')
          PY
          node --check /tmp/index-inline.js
          echo 'JavaScript syntax check passed.'

      - name: Commit repaired index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html changes needed.'
            exit 0
          fi
          git commit -m 'Fix final ending literal newline escapes'
          git push

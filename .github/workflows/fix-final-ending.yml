name: Fix final ending escapes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-final-ending:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair accidental literal escape sequences
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The injected final-ending markup was pasted with the two-character
          # sequence backslash+n instead of real line breaks. Convert those
          # placeholders everywhere in the HTML document. This site does not
          # use intentional literal \\n          # escape sequences in its HTML/CSS content.
          s = s.replace('\\\\n', '\n')

          # Repair accidental escaping introduced into the final inline JS.
          # Do this only inside script blocks so legitimate text elsewhere is
          # left untouched.
          def repair_script(match):
              block = match.group(1)
              block = block.replace('\\\\*', '*')
              block = block.replace('\\\\.', '.')
              return match.group(0)[:match.group(0).find('>') + 1] + block + '</script>'

          s = re.sub(r'<script[^>]*>(.*?)</script>', repair_script, s, flags=re.S | re.I)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify no accidental final-ending escapes remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          if r'\n' in html:
              raise SystemExit('Literal backslash+n remains in index.html')
          if r'\*' in html or r'\.' in html:
              raise SystemExit('Accidental escaped punctuation remains in index.html')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit repaired index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix literal newline escapes in final ending'
          git push

      - name: Remove one-time repair workflow
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-final-ending.yml
          git commit -m 'Remove one-time repair workflow'
          git push

name: Fix literal newline placeholders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-newlines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace only literal newline placeholders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          literal = r'\\n'

          # These placeholders were pasted outside string literals. Replace every
          # literal backslash+n in the HTML/CSS/JS source with a real line break.
          # There are no intentional \\n          # escape sequences in JavaScript strings in this document that should be preserved.
          replacements = text.count(literal)
          fixed = text.replace(literal, '\n')

          path.write_text(fixed, encoding='utf-8')
          print(f'Replaced {replacements} literal \\n          n placeholders.')

          # Verify that no literal backslash+n remains in the source.
          remaining = fixed.count(literal)
          if remaining:
              raise SystemExit(f'ERROR: {remaining} literal \\n          n placeholders remain')
          PY

      - name: Verify HTML structure and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('ERROR: No inline script found')

          # Check the inline JavaScript with Node's parser without executing it.
          js = '\n\n'.join(scripts)
          Path('/tmp/index-inline.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          assert text.count('<style>') == text.count('</style>'), 'Unbalanced style tags'
          assert text.count('<script>') == text.count('</script>'), 'Unbalanced script tags'
          assert text.count('<body>') == 1 and text.count('</body>') == 1, 'Unbalanced body tags'
          print('index.html structure and inline JavaScript syntax verified successfully.')
          PY

      - name: Commit fixed index.html and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-literal-newlines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-literal-newlines.yml
          git commit -m "Fix literal newline placeholders in index.html"
          git push

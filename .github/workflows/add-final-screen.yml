name: Add final birthday ending

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-final-screen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add final screen without changing existing content
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* =========================\n       FINAL ENDING EXPERIENCE\n    ========================== */'
          if marker not in text:
              css = r'''\n    /* =========================\n       FINAL ENDING EXPERIENCE\n    ========================== */\n\n    #finalEnding {\n      position: relative;\n      min-height: 100vh;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: 120px 6%;\n      overflow: hidden;\n      text-align: center;\n      background: transparent;\n    }\n\n    .final-ending-glow {\n      position: absolute;\n      width: min(560px, 90vw);\n      height: min(560px, 90vw);\n      border-radius: 50%;\n      background: radial-gradient(circle, rgba(255, 159, 186, .28), transparent 68%);\n      filter: blur(12px);\n      animation: finalGlow 7s ease-in-out infinite alternate;\n      pointer-events: none;\n    }\n\n    @keyframes finalGlow {\n      from { transform: scale(.88); opacity: .65; }\n      to { transform: scale(1.08); opacity: 1; }\n    }\n\n    .final-ending-inner {\n      position: relative;\n      z-index: 2;\n      width: min(720px, 100%);\n      padding: clamp(34px, 7vw, 70px) clamp(22px, 6vw, 60px);\n      border: 1px solid rgba(255, 255, 255, .78);\n      border-radius: 30px;\n      background: rgba(255, 255, 255, .42);\n      box-shadow: 0 25px 80px rgba(76, 20, 43, .09);\n      backdrop-filter: blur(14px);\n      -webkit-backdrop-filter: blur(14px);\n      animation: finalEndingIn 1.1s ease both;\n    }\n\n    @keyframes finalEndingIn {\n      from { opacity: 0; transform: translateY(28px) scale(.985); }\n      to { opacity: 1; transform: translateY(0) scale(1); }\n    }\n\n    .final-ending-kicker {\n      display: inline-block;\n      margin-bottom: 20px;\n      color: var(--hot-pink);\n      font-family: Arial, sans-serif;\n      font-size: .72rem;\n      font-weight: bold;\n      text-transform: uppercase;\n      letter-spacing: .22em;\n    }\n\n    .final-ending-inner h2 {\n      max-width: 650px;\n      margin: 0 auto 22px;\n      font-size: clamp(2.8rem, 8vw, 6.2rem);\n      line-height: .98;\n      letter-spacing: -.045em;\n    }\n\n    .final-ending-inner h2 span {\n      color: var(--hot-pink);\n      font-style: italic;\n    }\n\n    .final-ending-copy {\n      max-width: 520px;\n      margin: 0 auto 32px;\n      color: var(--muted);\n      font-size: clamp(1rem, 2.6vw, 1.1rem);\n      line-height: 1.8;\n    }\n\n    .final-surprise-button {\n      border: none;\n      cursor: pointer;\n      padding: 15px 28px;\n      border-radius: 100px;\n      color: white;\n      background: linear-gradient(135deg, var(--hot-pink), #ff7197);\n      box-shadow: 0 12px 30px rgba(255, 47, 109, .2);\n      transition: .3s ease;\n      font-family: Arial, sans-serif;\n      font-size: .82rem;\n      letter-spacing: .05em;\n    }\n\n    .final-surprise-button:hover {\n      transform: translateY(-3px) scale(1.02);\n      box-shadow: 0 16px 35px rgba(255, 47, 109, .28);\n    }\n\n    .final-ending-particles {\n      position: absolute;\n      inset: 0;\n      pointer-events: none;\n      overflow: hidden;\n    }\n\n    .final-ending-particle {\n      position: absolute;\n      bottom: -30px;\n      color: rgba(255, 47, 109, .26);\n      animation: finalParticleFloat linear infinite;\n      user-select: none;\n    }\n\n    @keyframes finalParticleFloat {\n      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }\n      12% { opacity: .85; }\n      88% { opacity: .55; }\n      100% { transform: translateY(-115vh) translateX(35px) rotate(180deg); opacity: 0; }\n    }\n\n    .final-burst {\n      position: fixed;\n      left: 50%;\n      top: 50%;\n      z-index: 1000;\n      width: 8px;\n      height: 8px;\n      margin: -4px;\n      border-radius: 50%;\n      pointer-events: none;\n      animation: finalBurst 1.8s cubic-bezier(.2,.7,.2,1) forwards;\n    }\n\n    @keyframes finalBurst {\n      0% { transform: translate(0, 0) scale(.5); opacity: 0; }\n      12% { opacity: 1; }\n      100% { transform: translate(var(--burst-x), var(--burst-y)) rotate(360deg) scale(.2); opacity: 0; }\n    }\n\n    @media (max-width: 520px) {\n      #finalEnding {\n        padding: 100px 5%;\n      }\n\n      .final-ending-inner {\n        border-radius: 24px;\n        padding: 38px 18px 34px;\n      }\n\n      .final-ending-copy {\n        line-height: 1.7;\n      }\n\n      .final-surprise-button {\n        width: min(100%, 260px);\n      }\n    }\n\n    @media (prefers-reduced-motion: reduce) {\n      #finalEnding *,\n      #finalEnding *::before,\n      #finalEnding *::after {\n        animation-duration: .01ms !important;\n        animation-iteration-count: 1 !important;\n        transition-duration: .01ms !important;\n      }\n    }\n'''
              text = text.replace('</style>', css + '\n  </style>', 1)

          html = r'''\n\n  <!-- =========================\n       FINAL ENDING EXPERIENCE\n  ========================== -->\n  <section id="finalEnding" aria-label="Final birthday message">\n    <div class="final-ending-glow" aria-hidden="true"></div>\n    <div class="final-ending-particles" id="finalEndingParticles" aria-hidden="true"></div>\n\n    <div class="final-ending-inner">\n      <span class="final-ending-kicker">One last little thing</span>\n      <h2>Okay, that's all. <span>❤️</span><br>Now go enjoy your birthday.</h2>\n      <p class="final-ending-copy">Hope this little corner of the internet made you smile.</p>\n      <button class="final-surprise-button" id="finalSurpriseButton" type="button">One last surprise ✨</button>\n    </div>\n  </section>\n'''
          text = text.replace('\n\n  <footer>', html + '\n\n  <footer>', 1)

          js_marker = '/* =========================\n       FINAL ENDING EXPERIENCE\n    ========================== */'
          js = r'''\n\n    /* =========================\n       FINAL ENDING EXPERIENCE\n    ========================== */\n\n    const finalEnding = document.getElementById("finalEnding");\n    const finalEndingParticles = document.getElementById("finalEndingParticles");\n    const finalSurpriseButton = document.getElementById("finalSurpriseButton");\n\n    if (finalEnding && finalEndingParticles && finalSurpriseButton) {\n      const finalSymbols = ["♡", "♥", "✦", "✧", "·"];\n\n      for (let i = 0; i < 22; i++) {\n        const particle = document.createElement("span");\n        particle.className = "final-ending-particle";\n        particle.textContent = finalSymbols[Math.floor(Math.random() * finalSymbols.length)];\n        particle.style.left = Math.random() * 100 + "%";\n        particle.style.animationDuration = (9 + Math.random() * 10) + "s";\n        particle.style.animationDelay = (-Math.random() * 16) + "s";\n        particle.style.fontSize = (8 + Math.random() * 14) + "px";\n        finalEndingParticles.appendChild(particle);\n      }\n\n      const finalObserver = new IntersectionObserver((entries) => {\n        entries.forEach((entry) => {\n          if (entry.isIntersecting) {\n            finalEnding.classList.add("is-visible");\n            finalObserver.unobserve(finalEnding);\n          }\n        });\n      }, { threshold: .12 });\n\n      finalObserver.observe(finalEnding);\n\n      finalSurpriseButton.addEventListener("click", () => {\n        const burstSymbols = ["♥", "♡", "✦", "✧"];\n\n        for (let i = 0; i < 42; i++) {\n          const burst = document.createElement("span");\n          burst.className = "final-burst";\n          burst.textContent = burstSymbols[Math.floor(Math.random() * burstSymbols.length)];\n          burst.style.color = i % 3 === 0 ? "var(--hot-pink)" : "var(--rose)";\n          const angle = Math.random() * Math.PI * 2;\n          const distance = 90 + Math.random() * Math.min(window.innerWidth, window.innerHeight) * .42;\n          burst.style.setProperty("--burst-x", Math.cos(angle) * distance + "px");\n          burst.style.setProperty("--burst-y", Math.sin(angle) * distance + "px");\n          burst.style.animationDelay = Math.random() * .16 + "s";\n          document.body.appendChild(burst);\n          setTimeout(() => burst.remove(), 2200);\n        }\n\n        finalSurpriseButton.textContent = "Made you smile? ♡";\n      });\n    }\n'''
          # Insert immediately before the existing closing script tag, keeping all existing JS intact.
          text = text.replace('\n  </script>', js + '\n  </script>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push final screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-final-screen.yml
          git add index.html .github/workflows/add-final-screen.yml
          git commit -m "Add final birthday ending screen" || exit 0
          git push
